name: Testing

# Triggered manually only; the optional test-filter input scopes the suite.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional -run regexp to scope the test suite'
        required: false
        default: ''

permissions:
  contents: read

# Always force the use of Go modules
env:
  GO111MODULE: on

jobs:
  # Check generated protos match their source repos (optional for PRs).
  # Disabled: this static check regenerates the protos from the upstream proto
  # repositories at their current HEAD, which have moved on since the v1.82.1
  # release, so it reports drift unrelated to this build.
  vet-proto:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup the environment.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: "**/go.sum"

      # Run the vet-proto checks.
      - name: vet-proto
        run: ./scripts/vet-proto.sh -install && ./scripts/vet-proto.sh

  # Build the released Go module zip (google.golang.org/grpc v1.82.1) and
  # upload it as a workflow artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: "**/go.sum"

      - name: Build module zip
        run: |
          set -eux
          cp -r "${GITHUB_WORKSPACE}" /tmp/modsrc
          rm -rf /tmp/modsrc/.git
          mkdir -p /tmp/zipper /tmp/out
          cd /tmp/zipper
          cat > main.go <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              out, err := os.Create(os.Args[3])
              if err != nil {
                  log.Fatal(err)
              }
              defer out.Close()
              v := module.Version{Path: "google.golang.org/grpc", Version: os.Args[1]}
              if err := zip.CreateFromDir(out, v, os.Args[2]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          go mod init zipper
          GOFLAGS=-mod=mod go get golang.org/x/mod@v0.24.0
          GOFLAGS=-mod=mod go run . v1.82.1 /tmp/modsrc /tmp/out/v1.82.1.zip
          ls -l /tmp/out

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: /tmp/out/v1.82.1.zip
          if-no-files-found: error

  # Run the main gRPC-Go tests.
  tests:
    name: ${{ matrix.display_name }}

    # Use the matrix variable to set the runner, with 'ubuntu-latest' as the
    # default.
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: vet
            goversion: '1.25'
            display_name: 'static checks (latest-1)'

          - type: extras
            goversion: '1.26'
            display_name: 'extras (latest)'

          - type: tests
            goversion: '1.26'
            display_name: 'tests (latest)'

          - type: tests
            goversion: '1.26'
            testflags: -race
            display_name: 'tests (-race, latest)'

          - type: tests
            goversion: '1.26'
            goarch: 386
            display_name: 'tests (i386, latest)'

          - type: tests
            goversion: '1.26'
            goarch: arm64
            runner: ubuntu-24.04-arm
            display_name: 'tests (arm, latest)'

          - type: tests
            goversion: '1.26'
            runner: windows-latest
            display_name: 'tests (windows, latest)'

          - type: tests
            goversion: '1.25'
            display_name: 'tests (latest-1)'

    steps:
      # Setup the environment.
      - name: Setup GOARCH
        if: matrix.goarch != ''
        shell: bash
        run: echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: Setup GRPC environment
        if: matrix.grpcenv != ''
        shell: bash
        run: echo "${{ matrix.grpcenv }}" >> $GITHUB_ENV

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goversion }}
          cache-dependency-path: "**/*go.sum"

      # Only run vet for 'vet' runs.
      - name: Run vet.sh
        if: matrix.type == 'vet'
        shell: bash
        run: ./scripts/vet.sh -install && ./scripts/vet.sh

      # Main tests run for everything except when testing "extras"
      # (where we run a reduced set of tests).
      - name: Run tests
        if: matrix.type == 'tests'
        shell: bash
        run: |
          go version
          if [ -n "${{ inputs.test-filter }}" ]; then
            # The dispatch input cannot carry '|', so the selector uses ',' as
            # the alternation separator; translate it back to a -run regexp.
            RUN_RE=$(printf '%s' '${{ inputs.test-filter }}' | tr ',' '|')
            echo "Scoped test run: -run ${RUN_RE}"
            go test ${{ matrix.testflags }} -cpu 1,4 -timeout 7m -run "${RUN_RE}" ./...
          else
            go test ${{ matrix.testflags }} -cpu 1,4 -timeout 7m ./...
            cd "${GITHUB_WORKSPACE}"
            for MOD_FILE in $(find . -name 'go.mod' | grep -Ev '^\./go\.mod'); do
              pushd "$(dirname ${MOD_FILE})"
              go test ${{ matrix.testflags }} -cpu 1,4 -timeout 2m ./...
              popd
            done
          fi

      # Non-core gRPC tests (examples, interop, etc)
      - name: Run extras tests
        if: matrix.type == 'extras'
        shell: bash
        run: |
          export TERM=${TERM:-xterm}
          go version
          echo -e "\n-- Running Examples --"
          examples/examples_test.sh
          echo -e "\n-- Running AdvancedTLS Examples --"
          security/advancedtls/examples/examples_test.sh
          echo -e "\n-- Running Interop Test --"
          interop/interop_test.sh
          echo -e "\n-- Running xDS E2E Test --"
          internal/xds/test/e2e/run.sh
          echo -e "\n-- Running protoc-gen-go-grpc test --"
          ./scripts/vet-proto.sh -install
          cmd/protoc-gen-go-grpc/protoc-gen-go-grpc_test.sh
